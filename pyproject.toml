[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fmannot"
version = "0.1.0"
description = "Annotation of SNP data with genomic foundation models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alphagenome",
    "numcodecs>=0.16.3",
    "pyyaml>=6.0.3",
    "streamlit>=1.51.0",
    "tqdm>=4.67.1",
    "zarr>=3.1.3",
]

[tool.uv.sources]
alphagenome = { git = "https://github.com/google-deepmind/alphagenome.git" }

[tool.setuptools.packages.find]
where = ["src"]
